    <!-- Contact Section -->

    <section class="contact">

        <h2>Contact Us</h2>

        <p>We'd love to hear from you! Feel free to contact us.</p>

        <div class="contact-container">

            <div class="contact-info">

                <h3>📍 Visit Us</h3>
                <p>Kolkata, West Bengal, India</p>

                <h3>📞 Call Us</h3>
                <p>+91 98765 43210</p>

                <h3>📧 Email</h3>
                <p>contact@mimosbite.com</p>

                <h3>🕒 Opening Hours</h3>
                <p>Monday – Sunday<br>9:00 AM – 9:00 PM</p>

            </div>

            <div class="contact-form">

                <form class="contact-form" id="contactForm">

                    <input type="text" placeholder="Your Name" required>

                    <input type="email" placeholder="Your Email" required>

                    <textarea placeholder="Write your message..." rows="6"></textarea>

                    <button type="submit" id="sendBtn">Send Message</button>

                    <p id="successMessage"></p>

                </form>
            </div>

        </div>

    </section>
